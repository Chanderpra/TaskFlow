name: iOS CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  build:

    name: Build TaskFlow

    runs-on: macos-15

    defaults:
      run:
        working-directory: TaskFlow

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode Version
        run: xcodebuild -version

      - name: Show Project Files
        run: ls -la

      - name: Show Schemes
        run: xcodebuild -list -project TaskFlow.xcodeproj

      - name: Resolve Swift Packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project TaskFlow.xcodeproj

      - name: Build
        run: |
          xcodebuild \
            clean build \
            -project TaskFlow.xcodeproj \
            -scheme TaskFlow \
            -destination "platform=iOS Simulator,name=iPhone 17"
